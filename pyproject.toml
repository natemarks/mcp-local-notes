[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-local-notes"
version = "0.1.0"
description = "Local markdown notes with a synchronized Turtle (TBox/ABox) ontology, exposed as a CLI and a local MCP server."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mcp-local-notes = "mcp_local_notes.cli.main:app"
mcp-local-notes-server = "mcp_local_notes.mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests requiring credentials or external fixtures",
]
